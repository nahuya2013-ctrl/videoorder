<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вертикальный Билборд - Градиент и Текст</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Быстро переливающийся градиент */
        .billboard-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            /* Скорость увеличена в 3 раза (было 10s, стало 3.3s) */
            animation: gradientShift 3.3s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер для контента с разворотом под вертикальный экран WebDisplays */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            /* Поворот на 90 градусов, чтобы компенсировать разворот монитора в игре */
            transform: rotate(90deg); 
            white-space: nowrap;
        }

        /* Стилизация блока с эмодзи */
        .emoji-container {
            font-size: 110px; /* Большой размер для видимости издалека */
            line-height: 1;
            margin-bottom: 40px; /* Отступ перед текстом, чтобы он был чуть ниже середины */
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.3));
        }

        /* Стилизация текста */
        .promo-text {
            color: #ffffff;
            font-size: 48px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            /* Мощная тень, чтобы текст читался на любом цвете градиента */
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.6), 
                         0px 2px 4px rgba(0, 0, 0, 0.8);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>

    <div class="billboard-bg">
        <div class="content-wrapper">
            <!-- Эмодзи телевизора, внутри которого эмодзи глобальной сети (интернета) -->
            <div class="emoji-container">📺🌐</div>
            
            <!-- Надпись чуть ниже середины -->
            <div class="promo-text">Реклама на этом экране</div>
        </div>
    </div>

</body>
</html>
