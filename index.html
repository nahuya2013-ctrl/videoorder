<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Синхронный Вертикальный Билборд</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Фоновый слой билборда */
        .billboard-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Фиксируем те же цвета */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            display: flex;
            justify-content: center;
            align-items: center;
            will-change: background-position;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transform: rotate(90deg); 
            white-space: nowrap;
        }

        .emoji-container {
            font-size: 80px;
            line-height: 1;
            margin-bottom: 25px; 
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.3));
        }

        .promo-text {
            color: #ffffff;
            font-size: 19.2px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.6), 0px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .tg-contact {
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.6), 0px 2px 4px rgba(0, 0, 0, 0.8);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="billboard-bg" id="sync-gradient">
        <div class="content-wrapper">
            <div class="emoji-container">📺🌐</div>
            <div class="promo-text">Реклама на этом экране</div>
            <div class="tg-contact">tg: @kochbrataan</div>
        </div>
    </div>

    <script>
        const bg = document.getElementById('sync-gradient');
        
        // Время полного цикла анимации в миллисекундах (3300 мс = 3.3 секунды, как заказывали)
        const animationDuration = 3300; 

        function syncAnimation() {
            // Получаем точное текущее время в миллисекундах
            const now = Date.now();
            
            // Вычисляем текущую фазу анимации от 0 до 1
            const progress = (now % animationDuration) / animationDuration;
            
            // Математически рассчитываем сдвиг градиента туда и обратно
            let positionX;
            if (progress < 0.5) {
                positionX = progress * 2 * 100;
            } else {
                positionX = (1 - (progress - 0.5) * 2) * 100;
            }
            
            // Применяем позицию напрямую к фону экрана
            bg.style.backgroundPosition = `${positionX}% 50%`;
            
            // Запускаем перерисовку на следующем кадре браузера
            requestAnimationFrame(syncAnimation);
        }

        // Запуск синхронизации
        syncAnimation();
    </script>
</body>
</html>
