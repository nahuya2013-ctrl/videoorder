<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Билборд - Продам гараж</title>
    <style>
        /* Убираем все отступы и скроллбары */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Вертикальный билборд */
        .billboard {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a15 60%, #000000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Мягкое световое пятно на фоне */
        .billboard::before {
            content: "";
            position: absolute;
            width: 90%;
            height: 60%;
            background: radial-gradient(circle, rgba(80, 120, 255, 0.18) 0%, transparent 70%);
            animation: pulse 6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.15); }
        }

        /* Контейнер для вертикального текста */
        .text {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            color: #ffffff;
            line-height: 1.05;
            letter-spacing: 0.03em;
            padding: 4vh 6vw;
            opacity: 0;
            animation: epicAppear 6s ease-in-out infinite;
        }

        /* Каждое слово — крупно и вертикально */
        .text span {
            display: block;
            font-size: 16vh; /* подстраивается под высоту экрана */
            text-shadow:
                0 0 20px rgba(120, 180, 255, 0.9),
                0 0 40px rgba(80, 120, 255, 0.7),
                0 0 80px rgba(50, 80, 200, 0.5);
        }

        /* Эпичное появление → удержание → исчезновение */
        @keyframes epicAppear {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(60px);
                filter: blur(20px);
            }
            15% {
                opacity: 1;
                transform: scale(1.12) translateY(0);
                filter: blur(0);
            }
            25% {
                transform: scale(1) translateY(0);
            }
            70% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
            85% {
                opacity: 0;
                transform: scale(1.35) translateY(-40px);
                filter: blur(15px);
            }
            100% {
                opacity: 0;
                transform: scale(0.3) translateY(60px);
                filter: blur(20px);
            }
        }

        /* Если экран очень узкий — уменьшаем шрифт */
        @media (max-aspect-ratio: 1/2) {
            .text span { font-size: 13vh; }
        }
    </style>
</head>
<body>

    <div class="billboard">
        <div class="text">
            <span>Продам</span>
            <span>гараж</span>
        </div>
    </div>

</body>
</html>
