<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вертикальный Билборд - Реклама</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Быстро переливающийся градиент */
        .billboard-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 3.3s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер для контента с разворотом под вертикальный экран WebDisplays */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transform: rotate(90deg); 
            white-space: nowrap;
        }

        /* Стилизация блока с эмодзи */
        .emoji-container {
            font-size: 80px; /* Немного уменьшен для баланса с новым текстом */
            line-height: 1;
            margin-bottom: 25px; 
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.3));
        }

        /* Основной текст (уменьшен в 2.5 раза: был 48px, стал ~19px) */
        .promo-text {
            color: #ffffff;
            font-size: 19.2px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px; /* Отступ перед контактом */
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.6), 
                         0px 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* Текст с контактом Telegram (еще поменьше) */
        .tg-contact {
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.6), 
                         0px 2px 4px rgba(0, 0, 0, 0.8);
            opacity: 0.9; /* Слегка приглушенный цвет для второстепенного текста */
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>

    <div class="billboard-bg">
        <div class="content-wrapper">
            <!-- Эмодзи телевизора и интернета -->
            <div class="emoji-container">📺🌐</div>
            
            <!-- Главная надпись (уменьшенная) -->
            <div class="promo-text">Реклама на этом экране</div>

            <!-- Контакт в Telegram ниже -->
            <div class="tg-contact">tg: @kochbrataan</div>
        </div>
    </div>

</body>
</html>
