<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вертикальный Билборд - Градиент</title>
    <style>
        /* Убираем все отступы и скроллбары */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Анимированный фон билборда */
        .billboard-bg {
            width: 100%;
            height: 100%;
            /* Задаем яркие цвета для градиента */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            /* Запуск бесконечной анимации переливания */
            animation: gradientShift 10s ease infinite;
        }

        /* Логика движения цветов градиента */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>

    <!-- Этот блок будет переливаться, пока вы не вставите сюда видео -->
    <div class="billboard-bg"></div>

</body>
</html>
