<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Билборд - Продам гараж</title>
    <style>
        /* Убираем все отступы и скроллбары */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Фон билборда — соотношение 2:1 (высота:ширина по визуалу) */
        .billboard {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* Тёмный элегантный фон с лёгким свечением */
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a15 60%, #000000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Мягкое световое пятно на фоне */
        .billboard::before {
            content: "";
            position: absolute;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(80, 120, 255, 0.15) 0%, transparent 70%);
            animation: pulse 6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.1); }
        }

        /* Сама надпись */
        .text {
            position: relative;
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: 12vh;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #ffffff;
            text-align: center;
            text-shadow:
                0 0 20px rgba(120, 180, 255, 0.8),
                0 0 40px rgba(80, 120, 255, 0.6),
                0 0 80px rgba(50, 80, 200, 0.4);
            opacity: 0;
            transform: scale(0.5) translateY(30px);
            animation: epicAppear 6s ease-in-out infinite;
            white-space: nowrap;
            padding: 0 4vw;
        }

        /* Эпичное появление → удержание → исчезновение */
        @keyframes epicAppear {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(60px);
                filter: blur(20px);
            }
            15% {
                opacity: 1;
                transform: scale(1.15) translateY(0);
                filter: blur(0);
            }
            25% {
                transform: scale(1) translateY(0);
            }
            70% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
            85% {
                opacity: 0;
                transform: scale(1.4) translateY(-40px);
                filter: blur(15px);
            }
            100% {
                opacity: 0;
                transform: scale(0.3) translateY(60px);
                filter: blur(20px);
            }
        }

        /* Адаптация под маленькие экраны */
        @media (max-aspect-ratio: 2/1) {
            .text { font-size: 10vh; }
        }
    </style>
</head>
<body>

    <div class="billboard">
        <div class="text">Продам гараж</div>
    </div>

</body>
</html>
